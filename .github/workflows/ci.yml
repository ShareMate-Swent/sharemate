# Co-authored-by: OpenAI ChatGPT
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests, lint, formatting and SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and lint
        run: ./gradlew check --no-daemon --stacktrace

      - name: Check Kotlin formatting
        run: ./gradlew ktfmtCheck --no-daemon --stacktrace

      - name: Generate coverage and debug lint reports
        run: ./gradlew :app:jacocoTestReport :app:lintDebug --no-daemon --stacktrace

      - name: Analyze with SonarCloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew :app:sonar --no-daemon --stacktrace
