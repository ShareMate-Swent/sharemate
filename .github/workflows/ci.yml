# Co-authored-by: OpenAI ChatGPT
name: ShareMate CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests, lint, formatting and SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Configure Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and lint
        run: ./gradlew check --no-daemon --stacktrace

      - name: Check Kotlin formatting
        run: ./gradlew ktfmtCheck --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run instrumented tests
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: firebase emulators:exec --only auth,firestore --project sharemate-swent "./gradlew connectedDebugAndroidTest --no-daemon --stacktrace"

      - name: Generate coverage and debug lint reports
        run: ./gradlew :app:jacocoTestReport :app:lintDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Set up Java 21 for SonarCloud
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Analyze with SonarCloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew :app:sonar --no-daemon --stacktrace
